<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Portal PPDB SMK Binamitra</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
        }

        .glow-bg-1 {
            animation: pulseGlow 8s infinite ease-in-out;
        }

        .glow-bg-2 {
            animation: pulseGlow 10s infinite ease-in-out reverse;
        }
    </style>
</head>

<body
    class="bg-[#030712] text-slate-100 h-screen w-screen flex items-center justify-center overflow-hidden relative select-none">

    <!-- Background Animated Glow Orbs -->
    <div
        class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none glow-bg-1">
    </div>
    <div
        class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none glow-bg-2">
    </div>

    <!-- Login Card Container -->
    <div
        class="relative z-10 w-full max-w-md mx-4 bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl shadow-indigo-950/50 transition-all duration-500">

        <!-- Logo / Brand Header -->
        <div class="flex flex-col items-center text-center mb-6">
            <div
                class="w-20 h-20 bg-slate-950/80 border border-slate-700/60 rounded-full flex items-center justify-center shadow-xl shadow-indigo-950/50 mb-3 p-2 ring-4 ring-indigo-500/10 transform hover:scale-105 transition duration-300">
                <img src="logo-removebg.png" alt="Logo SMK Binamitra"
                    class="w-full h-full object-contain drop-shadow-md">
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">Selamat Datang! 👋</h1>
            <p class="text-xs text-slate-400 mt-1">Portal Verifikator & Admin PPDB SMK Binamitra</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <!-- Input Username -->
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Username / ID
                    Admin</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Cth: admin"
                        class="w-full bg-slate-950/60 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white pl-10 pr-4 py-3 rounded-xl text-xs outline-none transition">
                </div>
            </div>

            <!-- Input Password -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">Password</label>
                    <a href="javascript:void(0)" onclick="bukaModalReset()"
                        class="text-[10px] text-indigo-400 hover:underline">Lupa password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••••••"
                        class="w-full bg-slate-950/60 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white pl-10 pr-10 py-3 rounded-xl text-xs outline-none transition">
                    <button type="button" onclick="togglePassword()"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300">
                        <i id="eyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Error Message Alert -->
            <div id="errorAlert"
                class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs px-3 py-2.5 rounded-xl flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Username atau password salah!</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-indigo-600/30 transition transform active:scale-95 flex items-center justify-center space-x-2">
                <span>Masuk Dashboard</span>
                <i class="fa-solid fa-arrow-right-long"></i>
            </button>
        </form>

        <!-- Demo Account Helper Box -->
        <div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
            <div
                class="inline-flex items-center space-x-2 bg-indigo-950/40 border border-indigo-800/40 px-3 py-1.5 rounded-lg text-[11px] text-indigo-300">
                <i class="fa-solid fa-lightbulb text-amber-400"></i>
                <span>Demo Akun: <strong class="text-white">admin</strong> / <strong
                        class="text-white">smkbinamitra</strong></span>
            </div>
        </div>
    </div>

    <!-- Modal Ganti / Reset Password Sendiri -->
    <div id="resetModal"
        class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 transition-all">
        <div
            class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl shadow-indigo-950/80">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div
                        class="w-10 h-10 bg-indigo-500/10 text-indigo-400 rounded-xl flex items-center justify-center text-lg">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-bold text-sm">Reset Password Mandiri</h3>
                        <p class="text-slate-400 text-[11px]">Masukkan username dan buat password baru Anda</p>
                    </div>
                </div>
                <button onclick="tutupModalReset()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Username /
                        ID Admin</label>
                    <input type="text" id="newResetUser" placeholder="Cth: admin"
                        class="w-full bg-slate-950/60 border border-slate-800 focus:border-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Password
                        Baru</label>
                    <input type="password" id="newResetPass" placeholder="Masukkan password baru"
                        class="w-full bg-slate-950/60 border border-slate-800 focus:border-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs outline-none transition">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button onclick="tutupModalReset()"
                        class="w-1/2 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                        Batal
                    </button>
                    <button onclick="simpanPasswordBaru()"
                        class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30">
                        Simpan Password
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Interaktif -->
    <script>
        // Fitur Lihat/Sembunyikan Password Login
        function togglePassword() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        }

        // Fungsi Buka & Tutup Modal Reset
        function bukaModalReset() {
            document.getElementById('resetModal').classList.remove('hidden');
        }

        function tutupModalReset() {
            document.getElementById('resetModal').classList.add('hidden');
            document.getElementById('newResetUser').value = '';
            document.getElementById('newResetPass').value = '';
        }

        // Fungsi Menyimpan Password Baru ke Browser (LocalStorage)
        function simpanPasswordBaru() {
            const user = document.getElementById('newResetUser').value.trim();
            const newPass = document.getElementById('newResetPass').value.trim();

            if (user === '' || newPass === '') {
                alert('Mohon isi username dan password baru Anda!');
                return;
            }

            // Simpan password baru ke localStorage browser berdasarkan username
            localStorage.setItem('admin_pass_' + user, newPass);
            alert(`Password untuk akun "${user}" berhasil diperbarui! Silakan login dengan password baru Anda.`);
            tutupModalReset();
        }

        // Fungsi Proses Login
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');

            // Cek apakah ada password custom tersimpan di localStorage, jika tidak gunakan default 'smkbinamitra'
            const savedCustomPass = localStorage.getItem('admin_pass_' + user);
            const validPassword = savedCustomPass ? savedCustomPass : 'smkbinamitra';

            if (user === 'admin' && pass === validPassword) {
                errorAlert.classList.add('hidden');
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat Berhasil...`;
                submitBtn.disabled = true;

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                errorAlert.classList.remove('hidden');
                document.getElementById('errorText').innerText = "Username atau Password salah!";
            }
        }
    </script>
</body>

</html>
