<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran & Upload Berkas - PPDB SMK Binamitra</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .uppercase-input {
            text-transform: uppercase;
        }
    </style>
</head>

<body class="bg-[#030712] text-slate-100 min-h-screen py-10 px-4 relative flex items-center justify-center"
    style="background-image: linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.85)), url('bg-smk.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">

    <!-- TOAST NOTIFICATION MODERN -->
    <div id="toastNotif"
        class="fixed top-6 right-6 z-50 transform translate-x-full opacity-0 transition-all duration-300 ease-out bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 text-white px-5 py-4 rounded-2xl shadow-2xl flex items-center space-x-3">
        <div id="toastIcon"
            class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-check"></i>
        </div>
        <div>
            <h4 id="toastTitle" class="text-xs font-bold">Berhasil!</h4>
            <p id="toastMsg" class="text-[11px] text-slate-400">Pesan notifikasi...</p>
        </div>
    </div>

    <!-- KARTU FORM PENDAFTARAN & UPLOAD -->
    <div
        class="relative z-10 w-full max-w-3xl bg-slate-900/90 backdrop-blur-2xl border border-slate-800 p-8 rounded-3xl shadow-2xl shadow-indigo-950/80 space-y-6">

        <!-- HEADER KARTU -->
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-5">
            <div class="flex items-center space-x-3">
                <div
                    class="w-12 h-12 bg-slate-950/80 border border-slate-700/60 rounded-2xl flex items-center justify-center shadow-lg p-1.5 flex-shrink-0">
                    <img src="logo-removebg.png" alt="Logo SMK Binamitra" class="w-full h-full object-contain"
                        onerror="this.style.display='none'">
                </div>
                <div>
                    <h1 class="text-base font-black tracking-tight text-white uppercase">Formulir Pendaftaran & Upload
                        Berkas</h1>
                    <p class="text-xs text-slate-400 mt-0.5">PPDB SMK Binamitra Tahun Ajaran 2026/2027</p>
                </div>
            </div>
            <a href="login.html"
                class="text-xs font-bold text-indigo-400 hover:text-indigo-300 flex items-center space-x-1.5 bg-indigo-950/50 border border-indigo-800/60 px-3.5 py-2 rounded-xl transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Kembali Login</span>
            </a>
        </div>

        <!-- FORMULIR INPUT -->
        <form id="formPendaftaranOnline" onsubmit="simpanPendaftaran(event)" class="space-y-6 text-xs">

            <!-- SECTION 1: BIODATA UTAMA -->
            <div class="space-y-3">
                <h3 class="text-emerald-400 font-bold uppercase tracking-wider text-[11px] flex items-center space-x-2">
                    <i class="fa-solid fa-user-pen"></i>
                    <span>1. Data Identitas Calon Siswa</span>
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Nama Lengkap (Auto Caps Lock) -->
                    <div class="space-y-1.5">
                        <label class="block font-bold text-slate-400 uppercase tracking-wider">Nama Lengkap</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"><i
                                    class="fa-solid fa-user"></i></span>
                            <input type="text" id="nama" required placeholder="Cth: Muhammad Rizky"
                                oninput="this.value = this.value.toUpperCase()"
                                class="w-full bg-slate-950/80 border border-slate-800 focus:border-emerald-500 text-white pl-10 pr-4 py-3 rounded-xl outline-none transition uppercase-input">
                        </div>
                    </div>

                    <!-- NISN -->
                    <div class="space-y-1.5">
                        <label class="block font-bold text-slate-400 uppercase tracking-wider">Nomor NISN</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"><i
                                    class="fa-solid fa-id-card"></i></span>
                            <input type="text" id="nisn" required placeholder="Cth: 0089234567"
                                class="w-full bg-slate-950/80 border border-slate-800 focus:border-emerald-500 text-white pl-10 pr-4 py-3 rounded-xl outline-none transition">
                        </div>
                    </div>

                    <!-- Asal Sekolah (Auto Caps Lock) -->
                    <div class="space-y-1.5">
                        <label class="block font-bold text-slate-400 uppercase tracking-wider">Asal Sekolah (SMP /
                            MTs)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"><i
                                    class="fa-solid fa-school"></i></span>
                            <input type="text" id="sekolah" required placeholder="Cth: SMP Negeri 1 Cikarang"
                                oninput="this.value = this.value.toUpperCase()"
                                class="w-full bg-slate-950/80 border border-slate-800 focus:border-emerald-500 text-white pl-10 pr-4 py-3 rounded-xl outline-none transition uppercase-input">
                        </div>
                    </div>

                    <!-- Nomor WhatsApp -->
                    <div class="space-y-1.5">
                        <label class="block font-bold text-slate-400 uppercase tracking-wider">Nomor WhatsApp /
                            HP</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"><i
                                    class="fa-solid fa-phone"></i></span>
                            <input type="text" id="telepon" required placeholder="Cth: 081234567890"
                                class="w-full bg-slate-950/80 border border-slate-800 focus:border-emerald-500 text-white pl-10 pr-4 py-3 rounded-xl outline-none transition">
                        </div>
                    </div>

                    <!-- Pilihan Jurusan -->
                    <div class="space-y-1.5">
                        <label class="block font-bold text-slate-400 uppercase tracking-wider">Kompetensi Keahlian
                            (Jurusan)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"><i
                                    class="fa-solid fa-graduation-cap"></i></span>
                            <select id="jurusan" required
                                class="w-full bg-slate-950/80 border border-slate-800 focus:border-emerald-500 text-white pl-10 pr-4 py-3 rounded-xl outline-none transition appearance-none">
                                <option value="" disabled selected>-- Pilih Jurusan --</option>
                                <option value="Teknik Komputer & Jaringan (TKJ)">Teknik Komputer & Jaringan (TKJ)
                                </option>
                                <option value="Akuntansi & Keuangan Lembaga (AK)">Akuntansi & Keuangan Lembaga (AK)
                                </option>
                                <option value="Teknik Bisnis Sepeda Motor (TSM)">Teknik Bisnis Sepeda Motor (TSM)
                                </option>
                                <option value="Teknik Kendaraan Ringan (TKR)">Teknik Kendaraan Ringan (TKR)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Jalur Pendaftaran -->
                    <div class="space-y-1.5">
                        <label class="block font-bold text-slate-400 uppercase tracking-wider">Jalur Pendaftaran</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500"><i
                                    class="fa-solid fa-route"></i></span>
                            <select id="jalur" required
                                class="w-full bg-slate-950/80 border border-slate-800 focus:border-emerald-500 text-white pl-10 pr-4 py-3 rounded-xl outline-none transition appearance-none">
                                <option value="" disabled selected>-- Pilih Jalur --</option>
                                <option value="Zonasi">Zonasi</option>
                                <option value="Prestasi">Prestasi</option>
                                <option value="Afirmasi">Afirmasi</option>
                                <option value="Mutasi">Mutasi (Pindah Tugas)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: UPLOAD BERKAS PERSYARATAN -->
            <div class="space-y-3 pt-2 border-t border-slate-800/80">
                <h3 class="text-emerald-400 font-bold uppercase tracking-wider text-[11px] flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>2. Upload Dokumen Persyaratan (Format PDF / JPG / PNG)</span>
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="space-y-1.5 bg-slate-950/40 border border-slate-800 p-3.5 rounded-2xl">
                        <label class="block font-bold text-slate-300 text-[11px]">Kartu Keluarga (KK)</label>
                        <input type="file" id="fileKk" accept=".pdf, .jpg, .jpeg, .png"
                            class="w-full text-[10px] text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-[10px] file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                    </div>

                    <div class="space-y-1.5 bg-slate-950/40 border border-slate-800 p-3.5 rounded-2xl">
                        <label class="block font-bold text-slate-300 text-[11px]">Akta Kelahiran</label>
                        <input type="file" id="fileAkta" accept=".pdf, .jpg, .jpeg, .png"
                            class="w-full text-[10px] text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-[10px] file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                    </div>

                    <div class="space-y-1.5 bg-slate-950/40 border border-slate-800 p-3.5 rounded-2xl">
                        <label class="block font-bold text-slate-300 text-[11px]">Ijazah / SKL / Rapor</label>
                        <input type="file" id="fileIjazah" accept=".pdf, .jpg, .jpeg, .png"
                            class="w-full text-[10px] text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-[10px] file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Tombol Kirim -->
            <div class="pt-4">
                <button type="submit" id="btnKirim"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-900/40 transition flex items-center justify-center space-x-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Kirim Pendaftaran & Upload Berkas Sekarang</span>
                </button>
            </div>
        </form>

    </div>

    <!-- JAVASCRIPT LOGIKA PENDAFTARAN & UPLOAD (BASE64) -->
    <script>
        function showToast(title, message, isSuccess = true) {
            const toast = document.getElementById('toastNotif');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = message;
            if (isSuccess) {
                document.getElementById('toastIcon').className = "w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0";
                document.getElementById('toastIcon').innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                document.getElementById('toastIcon').className = "w-8 h-8 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center flex-shrink-0";
                document.getElementById('toastIcon').innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }
            toast.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-x-full', 'opacity-0'), 3500);
        }

        function simpanPendaftaran(e) {
            e.preventDefault();

            let nama = document.getElementById('nama').value.trim();
            let nisn = document.getElementById('nisn').value.trim();
            let sekolah = document.getElementById('sekolah').value.trim();
            let telepon = document.getElementById('telepon').value.trim();
            let jurusan = document.getElementById('jurusan').value;
            let jalur = document.getElementById('jalur').value;

            let fileKkInput = document.getElementById('fileKk').files[0];
            let fileAktaInput = document.getElementById('fileAkta').files[0];
            let fileIjazahInput = document.getElementById('fileIjazah').files[0];

            function bacaFile(file, callback) {
                if (!file) {
                    callback("", "Belum diunggah");
                    return;
                }
                let reader = new FileReader();
                reader.onload = function (e) {
                    callback(e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            }

            const btn = document.getElementById('btnKirim');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengunggah Berkas...`;

            bacaFile(fileKkInput, (kkData, kkName) => {
                bacaFile(fileAktaInput, (aktaData, aktaName) => {
                    bacaFile(fileIjazahInput, (ijazahData, ijazahName) => {

                        let daftarSiswa = JSON.parse(localStorage.getItem('semua_siswa_ppdb') || '[]');

                        let duplikat = daftarSiswa.find(s => s.nisn === nisn);
                        if (duplikat) {
                            showToast("Pendaftaran Gagal", "NISN tersebut sudah terdaftar di sistem PPDB!", false);
                            btn.disabled = false;
                            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Kirim Pendaftaran & Upload Berkas Sekarang</span>`;
                            return;
                        }

                        const options = { day: 'numeric', month: 'short', year: 'numeric' };
                        let tglHariIni = new Date().toLocaleDateString('id-ID', options);

                        let siswaBaru = {
                            id: "SMKBN-" + Math.floor(1000 + Math.random() * 9000),
                            nama: nama,
                            nisn: nisn,
                            sekolah: sekolah,
                            telepon: telepon,
                            jurusan: jurusan,
                            jalur: jalur,
                            status: "Menunggu Verifikasi",
                            tgl: tglHariIni,
                            dokumen: {
                                kk: kkData, kkName: kkName,
                                akta: aktaData, aktaName: aktaName,
                                ijazah: ijazahData, ijazahName: ijazahName
                            }
                        };

                        daftarSiswa.push(siswaBaru);
                        localStorage.setItem('semua_siswa_ppdb', JSON.stringify(daftarSiswa));

                        showToast("Pendaftaran Berhasil!", "Data & dokumen berhasil dikirim. Mengalihkan...", true);

                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1500);
                    });
                });
            });
        }
    </script>
</body>

</html>
